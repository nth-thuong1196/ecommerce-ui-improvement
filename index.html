<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa hàng Trực tuyến</title>
    <!-- Liên kết đến file CSS riêng -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- KHU VỰC HEADER (Tiêu đề, Tìm kiếm, Giỏ hàng) -->
    <header class="site-header">
        <div class="header-container">
            <div class="logo">
                <a href="#">eShop.vn</a>
            </div>
            
            <div class="search-bar">
                <input type="text" placeholder="Tìm kiếm sản phẩm, thương hiệu...">
                <button type="button" aria-label="Tìm kiếm">🔍</button>
            </div>

            <div class="header-actions">
                <a href="#" class="cart-icon">
                    🛒 <span class="cart-badge">2</span>
                </a>
            </div>
        </div>
    </header>

    <!-- KHU VỰC NỘI DUNG CHÍNH -->
    <main>
        <!-- Khu vực sản phẩm nổi bật -->
        <section class="products-section">
            <div class="container">
                <h2 class="section-title">Gợi ý hôm nay</h2>
                
                <div class="product-grid">
                    <!-- Sản phẩm 1 -->
                    <article class="product-card">
                        <figure class="product-image">
                            <!-- Sử dụng ảnh placeholder mẫu -->
                            <img src="images/tai-nghe-blutooth.jpg" alt="Tai nghe Bluetooth Chống ồn Baseus Không Dây">
                            <span class="discount-badge">-15%</span>
                        </figure>
                        <div class="product-info">
                            <h3 class="product-name">Tai nghe Bluetooth Chống ồn Baseus Không Dây</h3>
                            <div class="product-price">
                                <span class="current-price">850.000đ</span>
                                <span class="old-price">1.000.000đ</span>
                            </div>
                            <button class="add-to-cart-btn">Thêm vào giỏ</button>
                        </div>
                    </article>

                    <!-- Sản phẩm 2 -->
                    <article class="product-card">
                        <figure class="product-image">
                            <img src="images/binh-giu-nhiet1.jpg" alt="Bình Giữ Nhiệt Cao Cấp Inox 304 Dung Tích 500ml">
                            <span class="discount-badge">-30%</span>
                        </figure>
                        <div class="product-info">
                            <h3 class="product-name">Bình Giữ Nhiệt Cao Cấp Inox 304 Dung Tích 500ml</h3>
                            <div class="product-price">
                                <span class="current-price">210.000đ</span>
                                <span class="old-price">300.000đ</span>
                            </div>
                            <button class="add-to-cart-btn">Thêm vào giỏ</button>
                        </div>
                    </article>

                    <!-- Sản phẩm 3 -->
                    <article class="product-card">
                        <figure class="product-image">
                            <img src="images/chuot-khong-day.jpg" alt="Chuột Không Dây Ergonomic Siêu Nhẹ">
                        </figure>
                        <div class="product-info">
                            <h3 class="product-name">Chuột Không Dây Ergonomic Siêu Nhẹ</h3>
                            <div class="product-price">
                                <span class="current-price">350.000đ</span>
                            </div>
                            <button class="add-to-cart-btn">Thêm vào giỏ</button>
                        </div>
                    </article>

                    <!-- Sản phẩm 4 -->
                    <article class="product-card">
                        <figure class="product-image">
                            <img src="images/balo-chong-nuoc.jpg" alt="Balo Laptop Chống Nước">
                            <span class="discount-badge">-10%</span>
                        </figure>
                        <div class="product-info">
                            <h3 class="product-name">Balo Laptop 15.6 inch Chống Thấm Nước Đa Năng</h3>
                            <div class="product-price">
                                <span class="current-price">450.000đ</span>
                                <span class="old-price">500.000đ</span>
                            </div>
                            <button class="add-to-cart-btn">Thêm vào giỏ</button>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
